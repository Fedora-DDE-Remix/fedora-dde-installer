name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_widget:
        description: Build the pinned Widget SDK for developer testing
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-tests:
    name: Workflow and backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure without GUI dependencies
        run: cmake -S . -B build-tests -DFEDORA_DDE_BUILD_GUI=OFF -DBUILD_TESTING=ON
      - name: Build workflow tests
        run: cmake --build build-tests --parallel 2
      - name: Run non-destructive tests
        run: ctest --test-dir build-tests --output-on-failure
      - name: Verify real installation mount namespace isolation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema":1,"test":"installer-mount-namespace","passed":false,"error":"The isolated test did not start or did not finish writing its report."}' \
            > build-tests/mount-namespace-integration.json
          sudo -n /usr/bin/unshare --mount --propagation private -- \
            /usr/bin/python3 -I tests/integration/test_mount_namespace.py \
            --report build-tests/mount-namespace-integration.json
      - name: Save mount namespace integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-mount-namespace-integration
          path: build-tests/mount-namespace-integration.json
          if-no-files-found: warn

  fedora-rpm:
    name: Fedora 45 RPM (x86_64)
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 40
    needs: safe-tests
    steps:
      - name: Install build tooling
        run: dnf -y install git curl rpm-build cmake gcc-c++ ninja-build dnf5-plugins
      - uses: actions/checkout@v4
      - name: Enable the project's DDE packages
        run: dnf -y copr enable mozixun/Fedora-DDE-Remix
      - name: Build the optional pinned DTK Widget SDK RPM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_widget }}
        shell: bash
        run: bash .github/scripts/bootstrap-dtk-widget.sh
      - name: Save the SDK RPMs and input checksums
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.bootstrap_widget }}
        uses: actions/upload-artifact@v4
        with:
          name: dtk6widget-6.7.54-fedora-45-x86_64
          path: |
            sdk-rpmbuild/RPMS/**/*.rpm
            sdk-rpmbuild/SRPMS/*.rpm
            sdk-rpmbuild/SPECS/*.spec
            sdk-rpmbuild/SOURCES.lock
            sdk-rpmbuild/build.log
          if-no-files-found: warn
      - name: Install declared build dependencies
        run: dnf -y --refresh builddep packaging/fedora-dde-installer.spec
      - name: Build the current commit as source and binary RPMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git -c safe.directory="$PWD" archive --format=tar --prefix=fedora-dde-installer-main/ HEAD |
            gzip -n > rpmbuild/SOURCES/fedora-dde-installer-main.tar.gz
          rpmbuild --define "_topdir $PWD/rpmbuild" -ba packaging/fedora-dde-installer.spec
      - name: Install the built RPM and verify Fedora encryption providers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(rpmbuild/RPMS/x86_64/fedora-dde-installer-[0-9]*.rpm)
          (( ${#packages[@]} == 1 ))
          dnf -y install "${packages[0]}"
          for path in /usr/bin/systemd-cryptsetup \
                      /usr/lib/systemd/system-generators/systemd-cryptsetup-generator; do
            test -f "$path" && test -x "$path"
            test "$(rpm -qf --qf '%{NAME}' "$path")" = systemd-udev
          done
          /usr/bin/systemd-cryptsetup --help > /dev/null
          rpm -q --qf '%{NAME}\t%{VERSION}-%{RELEASE}\t%{ARCH}\n' \
            fedora-dde-installer cryptsetup systemd-udev
      - name: Save RPMs
        uses: actions/upload-artifact@v4
        with:
          name: fedora-dde-installer-fedora-45-x86_64
          path: |
            rpmbuild/RPMS/**/*.rpm
            rpmbuild/SRPMS/*.rpm
          if-no-files-found: error
