[General]
; Fedora DDE Remix Installer: writable Fedora, install then configure in one Live session.
; Runtime settings are root-owned; passwords must never be copied into logs.
DI_INSTALL_MODE="default"
DI_LOCALE="zh_CN"
DI_USER_EXPERIENCE = false
DI_PRIVACY_POLICY = false
DI_COMPONENT_TYPE = ""
DI_IS_AUTO_DECRYPT = false
DI_DEVICE_LIST = ""
DI_DISK_ONLY_FORMAT = ""
DI_ENABLE_AUTO_SELECT_DISK=false
DI_PARTITION_TYPE = 0
DI_LAYOUT = "us"
DI_LAYOUT_VARIANT = ""
DI_IS_GHOST_MODE = false
DI_TIMEZONE="Asia/Shanghai"
DI_AVATAR = ""
DI_USERNAME = ""
DI_OLD_USERNAME_LIST = ""
DI_HOSTNAME = ""
DI_PASSWORD = ""
DI_QUICK_LOGIN=false
DI_IS_CHECK_MODE = false
DI_AUTO_CHECK_MODE = false
DI_CHECK_MODE_HOLD = false
DI_ROOT_PASSWORD = ""
DI_BOOTLOADER_IS_EFI = ""
DI_BOOTLOADER = ""
DI_USE_DEBUG_FRAME=false
DI_HOOKS_LIST = ""
DI_COMPONENT_PACKAGES=""
DI_COMPONENT_LANGUAGE=""
DI_UIMG_FILE = ""
DI_ENABLE_COMPRESS = 1
DI_REBOOT_AFTER_SETUP = false
DI_PART_POLICY_FILE = ""
DI_SAVE_USER_DATA_CLEAN_LIST=""
DI_USER_EXPERIENCE_LOAD=false
DI_PRIVACY_POLICY_LOAD=false
DI_CRYPTO_LOAD=false
DI_ROOT_USER_LOAD = false
DI_SAVE_USER_DATA_LOAD=false
DI_EDITION_PLUGIN_LOAD = false
DI_DEVICETYPES_CONFIG = "disk"
DI_PARTITION_CONFIG="/run/fedora-dde-installer/partition-policy.json"
DI_SOURCE_ROOT="auto"
DI_SYSTEM_FONT_SIZE_CONFIG = 14
DI_BOOTLOADER_OPTION_CONFIG="fedora"
DI_GRUB_TIMEOUT_CONFIG = 1
DI_GRUB_RESOLUTION_CONFIG = "auto"
; These are UI floors. Preflight measures the actual image plus free-space reserve.
DI_VALID_DEVICE_MIN_SIZE_CONFIG=14
DI_DEVICE_MIN_SIZE_CONFIG=14
DI_DDE_AVATAR_DIR_CONFIG = "/var/lib/AccountsService/icons/"
DI_EFI_SIZE_CONFIG=600
DI_BOOT_SIZE_CONFIG=2048
DI_ROOTA_SIZE_CONFIG=12288
DI_SWAP_MAX_SIZE_CONFIG=8192
DI_OTHER_SIZE_CONFIG = 2048
DI_LVM2_PV_SIZE_CONFIG = 5
DI_DATA_MIN_SIZE_CONFIG="0%"
DI_FIRST_IS_BOOTLOADER_CONFIG = false
DI_SIZE_MUNIT_CONFIG = "MiB"
DI_SIZE_GUNIT_CONFIG = "GiB"
DI_BOOT_PARTITION_FS_CONFIG="ext4"
DI_EFI_PARTITION_FS_CONFIG = "vfat"
DI_PARTITION_MOUNT_POINT_CONFIG="/;/boot;/boot/efi;/home;/var"
DI_PARTITION_FILESYSTEM_CONFIG="btrfs;ext4;xfs;linux-swap;vfat"
DI_LVM_FILESYSTEM_CONFIG="ext4"
DI_USERNAME_MIN_LEN_CONFIG=1
DI_USERNAME_MAX_LEN_CONFIG = 32
DI_HOSTNAME_RESERVED_CONFIG="localhost;localhost.localdomain"
DI_LOCK_HOSTNAME_CONFIG = false
DI_HOSTNAME_AUTO_SUFFIX_CONFIG="-pc"
DI_PASSWORD_ENCRYPTION_CONFIG=false
DI_PASSWORD_MIN_LEN_CONFIG=8
DI_PASSWORD_MAX_LEN_CONFIG=128
DI_PASSWORD_VALIDATE_CONFIG = "1234567890;abcdefghijklmnopqrstuvwxyz;ABCDEFGHIJKLMNOPQRSTUVWXYZ;~`!@#$%^&*()-_+=|\\{}[]:\"'<>,.?/"
DI_PASSWORD_VALIDATE_REQUIRED_CONFIG = 1
DI_PASSWORD_STRONG_CHECK_CONFIG = true
DI_PASSWORD_PALINGROME_LENGTH_CONFIG = 0
DI_PASSWORD_MONOTONOUS_LENGTH_CONFIG = 0
DI_PASSWORD_CONTINUOUS_LENGTH_CONFIG = 0
DI_IS_ENABLE_MOVIE_CONFIG=false
DI_DATA_MOUNT_POINT_CONFIG="/"
DI_FORMAT_PARTITION_CNT_CONFIG=1
DI_USE_RTC_TIME_CONFIG = true
DI_SYSTIME_TO_HC=false
DI_IS_ENABLE_NTP = true
DI_EXEC_EXTRA=false
DI_TPM_INITRAMFS_TOOL_CONFIG=""
DI_DISK_RSA_FILE_CONFIG=""
DI_DISK_PUB_RSA_FILE_CONFIG=""
DI_DISK_KEY_FILE_CONFIG=disk%1.key
DI_DISK_CRYPT_KEY_FILE_CONFIG=disk_crypt%1.key
DI_UI_DEFAULT_FONT_CONFIG="Noto Sans CJK SC"
DI_DESKTOP_ENV="wayland"
DI_EDITION_NAME="Fedora"
DI_DEFAULT_RESOLUTION="1920x1080;1400x1050;1440x900;1280x1024;1280x768;1024x768;1280x720;800x600"
DI_BACKGROUND_IMAGE="/usr/share/fedora-dde-installer/configs/slides/Fedora/mains/background.svg"
DI_UNSQUASHFS_EXTRA_PARAMS=""
DI_IS_SAVE_AUTHORIZED_DATA_CONFIG=false
DI_FB_HOOHS_LIST=""
